name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  QUAY_IMAGE_NAME: quay.io/tigrisdata/tigris-mcp-server
  DOCKER_IMAGE_NAME: tigrisdata/tigris-mcp-server

jobs:
  # Decide what this push needs:
  #   version -> pending changesets: open or update the "Version Packages" PR
  #   publish -> Version PR was merged: publish, tag, release, build images
  #   none    -> nothing to do
  select-mode:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - id: select
        uses: changesets/action/select-mode@v2

  version:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump
      pull-requests: write # open or update the Version Packages PR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - uses: changesets/action/version@v2

  publish:
    needs: select-mode
    if: needs.select-mode.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the vX.Y.Z tag and create the GitHub release
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN secret involved
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11.x; trusted publishing needs npm >= 11.5.1.
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm audit signatures
      - run: npm run build
      - id: publish
        uses: changesets/action/publish@v2
        with:
          script: npm run release
          create-github-releases: true
      - id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  docker:
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: v${{ needs.publish.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          install: true
          driver-opts: network=host

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_REGISTRY_USER }}
          password: ${{ secrets.QUAY_REGISTRY_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.GH_DOCKER_ACCESS_USER }}
          password: ${{ secrets.GH_DOCKER_ACCESS_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.QUAY_IMAGE_NAME }}:latest
            ${{ env.QUAY_IMAGE_NAME }}:${{ env.TAG }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.TAG }}
          provenance: false
